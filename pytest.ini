[pytest]
# Run from the repo root: python3 -m pytest
testpaths = tests
addopts   =
    --tb=short
    -q
    --strict-markers

markers =
    fast:    Pure-math or trivial computation (< 0.1 s per test)
    slow:    Requires full TOV integration or grid setup (may take seconds)
    network: Makes outbound HTTP requests — skipped in CI by default

# Show test durations for any test taking > 1 s
# (requires pytest >= 7)
